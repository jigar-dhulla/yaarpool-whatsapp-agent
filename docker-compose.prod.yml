name: yaarpool

x-php: &php
  image: ghcr.io/jigar-dhulla/yaarpool-whatsapp-agent:latest
  working_dir: /app
  env_file: .env
  environment:
    WA_WACLI_BINARY: /usr/local/bin/wacli
    WA_WACLI_DATABASE: /root/.wacli/wacli.db
    DB_DATABASE: /app/database/data/database.sqlite
  volumes:
    - ./.env:/app/.env
    - app-db:/app/database/data
    - app-storage:/app/storage
    - ${HOME}/.wacli:/root/.wacli
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
  # The image healthcheck probes Caddy's admin endpoint (:2019), which
  # php-server runs with admin disabled and workers never expose.
  healthcheck:
    disable: true
  restart: unless-stopped

services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped

  web:
    <<: *php
    command: ["sh", "-c", "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs && php artisan optimize && exec frankenphp php-server --listen :8080 --root public/"]
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.yaarpool.rule=Host(`${WEB_HOST:-rideshare.ing}`) || Host(`www.${WEB_HOST:-rideshare.ing}`)
      - traefik.http.routers.yaarpool.entrypoints=websecure
      - traefik.http.routers.yaarpool.tls.certresolver=letsencrypt
      - traefik.http.services.yaarpool.loadbalancer.server.port=8080

  wacli:
    <<: *php
    command: ["wacli", "sync", "--follow", "--refresh-contacts", "--refresh-groups"]

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=0"]
    depends_on:
      - wacli

  wa-listen:
    <<: *php
    command: ["php", "artisan", "wa:listen", "-vvv"]
    depends_on:
      - wacli

  app:
    <<: *php
    profiles: ["cli"]
    restart: "no"
    command: ["bash"]

volumes:
  app-db:
  app-storage:
  traefik-certs:

networks:
  proxy:
    name: proxy
